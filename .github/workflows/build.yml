name: Build
on:
  workflow_dispatch: {}
  push:
    branches:
      - "*"
    tags-ignore:
      - '*'

jobs:
  build:
    if: "!contains(github.event.commits[0].message, 'Bump Release [')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install gpg
        env:
          GPG_PRI: ${{ secrets.GPG_PRI }}
        run: |
          sudo apt update && sudo apt install -y gnupg2
          export GPG_TTY=$(tty)
          echo "${{ env.GPG_PRI }}" | gpg --batch --import
      - name: Testing && Publishing SNAPSHOT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CUSTOMER_RUSER_API_URL: ${{ secrets.CUSTOMER_API_URL }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
          SONAR_TOKEN: ${{ secrets.SQC_TOKEN }}
        run: |
          ./mvnw clean --batch-mode deploy -Dgpg.passphrase=${{ env.GPG_PASSPHRASE }} sonar:sonar -Psonarcloud
      - name: Sonarqube
        env:
          SONAR_HOST_URL: ${{ secrets.SQO_URL }}
          SONAR_TOKEN: ${{ secrets.SQO_TOKEN }}
        run: |
          ./mvnw sonar:sonar -Psonarqube
          
