name: Test for Pull Request
on: [pull_request]

jobs:
  pull-request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Testing
        run: |
          ./mvnw clean test

